services:
  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis-data:/data
    restart: always

  app:
    build: .
    image: artiview-app:v2
    volumes:
      - ./app:/app
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - redis
    restart: always
