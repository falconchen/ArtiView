version: '3.8'

services:
  redis:
    image: redis:7.4.1
    command: redis-server --appendonly yes
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis-data:/data
    restart: always


  app:
    build: .
    volumes:
      - ./app:/app
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: always
    depends_on:
      - redis
